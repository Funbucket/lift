[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lift-agent"
version = "0.1.0"
description = "Local cost-aware incrementality decision agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lift = "lift.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
