[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lift-agent"
version = "0.1.8"
description = "Local cost-aware incrementality decision agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "setuptools>=68",
]

[project.scripts]
lift = "lift.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lift.examples" = ["*.csv"]
"lift.oauth" = ["*.mjs"]
"lift.pi_assets" = ["*.mjs", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
